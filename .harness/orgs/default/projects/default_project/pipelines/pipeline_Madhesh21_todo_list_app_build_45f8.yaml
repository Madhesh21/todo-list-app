pipeline:
  id: pipeline_Madhesh21_todo_list_app_build_45f8
  name: pipeline_Madhesh21_todo_list_app_build_45f8
  stages:
    - name: Build
      id: build
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Install Dependencies
          id: install
          run:
            shell: bash
            script: npm ci
        - name: Lint
          id: lint
          run:
            shell: bash
            script: npm run lint
        - name: Build
          id: build_step
          run:
            shell: bash
            script: npm run build
        - name: Deploy to Netlify
          run:
            shell: bash
            script: "#!/usr/bin/env bash\r

              set -e\r

              \r

              echo \"Checking React build output...\"\r

              pwd\r

              ls -la\r

              \r

              if [ ! -d \"dist\" ]; then\r

              \  echo \"ERROR: dist folder not found\"\r

              \  exit 1\r

              fi\r

              \r

              echo \"Deploying to Netlify...\"\r

              npx --yes netlify-cli@23 deploy --no-build --dir=dist
              --site=\"$NETLIFY_SITE_ID\" --auth=\"$NETLIFY_AUTH_TOKEN\"\r

              \r

              echo \"Netlify draft deployment successful!\""
            env:
              NETLIFY_AUTH_TOKEN: <+secrets.getValue("netlify_auth_token")>
              NETLIFY_SITE_ID: "61574380-5c1a-49e0-8e76-b5f34004dca0 "
            container:
              image: node:22
              connector: Docker_Hub_Public
          id: deploy_to_netlify
  tags:
    onboarding: "true"
